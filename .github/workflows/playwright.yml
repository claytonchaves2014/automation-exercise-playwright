name: Testes de API, E2E e dispositivos móveis com Playwright

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    name: Testes - ${{ matrix.descricao }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: api
            descricao: API
          - suite: e2e
            descricao: E2E para computador
          - suite: mobile
            descricao: E2E para dispositivos móveis

    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador do Playwright
        if: matrix.suite != 'api'
        run: npx playwright install --with-deps chromium

      - name: Executar testes - ${{ matrix.descricao }}
        run: npm run test:${{ matrix.suite }}

      - name: Publicar relatório - ${{ matrix.descricao }}
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-playwright-${{ matrix.suite }}
          path: reports/
          if-no-files-found: warn
