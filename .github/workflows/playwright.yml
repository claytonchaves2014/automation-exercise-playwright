name: Testes de API, E2E e dispositivos móveis com Playwright

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    name: Testes - ${{ matrix.descricao }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: api
            descricao: API
          - suite: e2e
            descricao: E2E para computador
          - suite: mobile
            descricao: E2E para dispositivos móveis

    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador do Playwright
        if: matrix.suite != 'api'
        run: npx playwright install --with-deps chromium

      - name: Executar testes - ${{ matrix.descricao }}
        run: npm run test:${{ matrix.suite }}

      - name: Publicar relatório - ${{ matrix.descricao }}
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-playwright-${{ matrix.suite }}
          path: reports/
          if-no-files-found: warn

  mobile-native:
    name: Testes nativos Android - Appium
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Baixar e verificar aplicativo Android de demonstração
        run: npm run mobile:download

      - name: Executar testes nativos no emulador Android
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: bash mobile/run-ci.sh

      - name: Publicar relatório e evidências dos testes nativos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-appium-android
          path: reports/mobile/
          if-no-files-found: warn
